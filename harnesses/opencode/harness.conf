# opencode - see ../README.md for the format.
command=opencode
# Sessions and credentials (one SQLite database), snapshots, tool output, logs; prompt
# history and recent models.
# ~/.cache/opencode is deliberately NOT mounted: it holds the LSP servers and npm
# provider/plugin packages opencode downloads and runs (bin/, node_modules/), so a
# writable mount would let a session plant code the host's own opencode executes.
# Inside the container it's re-created per session and re-downloaded on demand.
state=.local/share/opencode .local/state/opencode
# Settings, MCP servers, plugins, custom tools, agents, commands, skills, AGENTS.md -
# all of it can make the host's opencode run something.
config=.config/opencode
