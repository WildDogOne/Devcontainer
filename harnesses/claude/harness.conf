# Claude Code. Read by run.sh/run.ps1 (host side) and baked into the image for
# entrypoint.sh - see harnesses/README.md for what each key means.

command=claude --permission-mode auto

# Login, transcripts, history, todos, OAuth token refreshes - Claude Code breaks without
# write access to these.
state=.claude

# Everything here can make the HOST's own `claude` run something or behave differently
# (hooks, MCP servers, plugins, ...), so it's read-only unless --allow-config.
config=.claude/settings.json .claude/settings.local.json .claude/CLAUDE.md .claude/keybindings.json .claude/agents .claude/commands .claude/skills .claude/hooks .claude/plugins .claude/output-styles

# Rewritten by Claude Code on every start, so it can't be a plain read-only mount.
staged=.claude.json
