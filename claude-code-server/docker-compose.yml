services:
  claude-code:
    build:
      context: .
      dockerfile: claude/Dockerfile
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: claude-code
    restart: unless-stopped
    init: true
    tty: true
    stdin_open: true
    working_dir: /workspace
    environment:
      # Bot token for the Telegram bot plugin - leave unset in .env if you're not using it.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      # Persists `claude login` and all other dotfiles/state across container restarts/rebuilds.
      - ./claude_home:/home/claude
      # Project code Claude Code will actually work on.
      - ${WORKSPACE_DIR:-./workspace}:/workspace
      # Same host directory the pcloud service's sync folder writes into
      # (plain files, not a FUSE mount - see README), so Claude Code can
      # read/write the synced files directly. pcloud runs as root and this
      # container's user doesn't, so files pcloud creates here may need a
      # permissive umask/ACL to be writable from this side - see README.
      - ${PCLOUD_SYNC_DIR:-./pcloud_sync}:/workspace/pcloud
      # Lets `docker` commands inside the container control the HOST's Docker daemon.
      # Anything with access to this socket can trivially get root on the host - see README.
      # - /var/run/docker.sock:/var/run/docker.sock

  # Built from the ibressler/pcloudcc-service submodule (see
  # claude-code-server/pcloud/) - `git submodule update --init` after
  # cloning, or this service has nothing to build. That project runs
  # pcloudcc as root with no non-root user, unlike claude-code, so files it
  # writes into shared volumes end up root-owned - see README.
  pcloud:
    build:
      context: ./pcloud
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-UTC}
    container_name: pcloud
    restart: unless-stopped
    init: true
    # Give pcloudcc room for a graceful unmount/cache flush on shutdown
    # before Docker SIGKILLs it.
    stop_grace_period: 30s
    environment:
      USERNAME: ${PCLOUD_USERNAME:-}
      TZ: ${TZ:-UTC}
    devices:
      # Required for the pcloudcc FUSE mount.
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      # Persists ~/.pcloud/data.db (login session, saved via `-s`) across
      # container restarts/rebuilds - see README for the one-time interactive
      # login needed to populate it (password + 2FA code, if enabled).
      - ${PCLOUD_HOME_DIR:-./pcloud_home}:/root/.pcloud
      # Plain host directory pCloud content gets synced into once configured
      # as a sync folder (`sync add /pcloud_sync <remote-path>` from the
      # `pcloudcc -k` command prompt - see README). Deliberately NOT mounted
      # at pcloudcc's FUSE mountpoint (/pCloudDrive, baked into the image's
      # CMD): a FUSE mount is local to this container's mount namespace and
      # wouldn't be visible to claude-code even over a shared bind mount,
      # whereas sync-folder mode writes plain files that do show up.
      - ${PCLOUD_SYNC_DIR:-./pcloud_sync}:/pcloud_sync
      - ${WORKSPACE_DIR:-./workspace}:/workspace
