services:
  claude-code:
    build:
      context: .
      dockerfile: claude/Dockerfile
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
        # Shared with the pcloud service below so both containers write files
        # under the same UID/GID and don't fight over ownership on anything
        # they both touch (e.g. PCLOUD_SYNC_DIR).
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: claude-code
    restart: unless-stopped
    init: true
    tty: true
    stdin_open: true
    working_dir: /workspace
    environment:
      # Bot token for the Telegram bot plugin - leave unset in .env if you're not using it.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      # Persists `claude login` and all other dotfiles/state across container restarts/rebuilds.
      - ./claude_home:/home/claude
      # Project code Claude Code will actually work on.
      - ${WORKSPACE_DIR:-./workspace}:/workspace
      # Same host directory the pcloud service syncs into, so Claude Code can
      # read/write the synced files directly. See README for the FUSE
      # mount-propagation caveat if pcloudcc mounts a virtual filesystem
      # rather than writing plain files to disk.
      - ${PCLOUD_SYNC_DIR:-./pcloud_sync}:/workspace/pcloud
      # Lets `docker` commands inside the container control the HOST's Docker daemon.
      # Anything with access to this socket can trivially get root on the host - see README.
      # - /var/run/docker.sock:/var/run/docker.sock

  pcloud:
    build:
      context: ./pcloud
      dockerfile: Dockerfile
      args:
        # Must match claude-code's USER_UID/USER_GID above - see README.
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: pcloud
    restart: unless-stopped
    init: true
    # Default (10s) races entrypoint.sh's own ~10s graceful-shutdown budget
    # for the pcloudcc daemon; give it real headroom before Docker SIGKILLs.
    stop_grace_period: 30s
    environment:
      PCLOUD_USERNAME: ${PCLOUD_USERNAME:-}
      PCLOUD_MOUNTPOINT: /pcloud
    devices:
      # Required for the pcloudcc FUSE mount.
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      # Persists ~/.pcloud/data.db (login session, saved via `-s`) across
      # container restarts/rebuilds - see README for the one-time interactive
      # login needed to populate it (password + 2FA code, if enabled).
      - ${PCLOUD_HOME_DIR:-./pcloud_home}:/home/pcloud
      - ${PCLOUD_SYNC_DIR:-./pcloud_sync}:/pcloud
      - ${WORKSPACE_DIR:-./workspace}:/workspace
